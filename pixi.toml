[workspace]
authors = ["llango<rontomai@gmail.com>"]
channels = [
    "https://conda.modular.com/max/",
    "conda-forge",
    "https://repo.prefix.dev/modular-community",
    "https://prefix.dev/mojo-force"
]
description = "an inference engine in pure Mojo."
name = "alofa"
platforms = ["linux-64"]  # TODO: add other platforms "osx-arm64",
version = "0.1.0"


[tasks]
# 套件清单（含各自的编译参数）在 scripts/run_tests.sh 里单一维护，这里只负责串起来。
# 单元套件需要 -I src 才能 import alofa.*；capability 下的平台探测与账本门不需要。
# 新增基础层文件后：① 在 run_tests.sh 加一条 ② 若文件在 core/ 下，同步
# test_layering.mojo 的文件清单 ③ 跑 `pixi run ledger-sync` 刷新账本里的 ?count=。
# tokenizer 差分门用 -O0：它要编译 13806 行的生成 Unicode 表，-O3 会把编译拖到 ~100 s
# （同一个套件 mojo build 出来跑只要 0.34 s —— 慢的是编译不是运行，且 TestSuite 打印的
# 耗时不可信：它报告 209 s 而进程墙钟只有 0.34 s）。
# run_tests.sh 会顺带产出 target/test_counts.tsv（各套件自报的通过条数），
# check-counts 据此核对账本里的 N/M 快照 —— 见 scripts/ledger_sync.py 的说明。
test = "bash scripts/run_tests.sh && pixi run check-ledger"
# 批一致性重门：同一批 prompt 在「1/2/4/8 条请求一批」与「一条一条跑」两种走法下必须
# 逐 token 相同（greedy，所以一个 token 不同就是一个不同）。它跑的是真实的 0.5B
# 权重，所以要 build 再跑，也因此没有并入 test —— 与 test-model / test-q4 同理。
test-batch-forward = "mkdir -p target && pixi run mojo build -O2 -I src tests/unit/test_batch_forward.mojo -o target/batch_forward && ./target/batch_forward"
# CI 监视：见 scripts/ci_watch.sh —— 绑定到当前 HEAD 的运行，而不是列表第一条，
# 否则推送刚落地的几秒里会误监视到上一次运行（往往是上一次的失败），结论相反。
ci-watch = "scripts/ci_watch.sh"
# 整网数值门：标量后端跑 4 条 prompt 的 prefill + 128 token greedy 需要几分钟，
# 所以必须先 build 再跑（mojo run 的默认优化级别下要慢一个数量级），也因此没有
# 并入 test —— 它仍然由 scripts/dump_model_reference.py --full 的本地产物驱动。
test-model = "mkdir -p target && pixi run mojo build -O2 -I src tests/unit/test_model_parity.mojo -o target/model_parity && ./target/model_parity"
test-q4 = "mkdir -p target && pixi run mojo build -O2 -I src tests/unit/test_q4_greedy.mojo -o target/q4_greedy && ./target/q4_greedy"
test-memory = "mkdir -p target && pixi run mojo build -O2 -I src tests/unit/test_memory_gate.mojo -o target/memory_gate && ./target/memory_gate"
# 整网**向量后端**门：与 test-model 同一批 prompt、同一段 fp32 参考、同一条
# cos 判据，只把后端参数换成 BACKEND_AVX2。同样不并入 test（2GB 权重 + 数分钟）。
test-model-avx2 = "mkdir -p target && pixi run mojo build -O2 -I src tests/unit/test_model_avx2_parity.mojo -o target/model_avx2_parity && ./target/model_avx2_parity"
# 编译期红测：tests/fixtures/bad_backend.mojo 必须**编译失败**，且失败原因是
# `unknown cpu backend`。拼错的后端常量若只是静默退化成标量，整网向量门会照绿
# —— 而它绿的原因是向量路径一次都没跑过。
test-backend-guard = "bash scripts/check_bad_backend.sh"
# 垂直切片：一句真文本走完 tokenizer → model → engine → sampler（真权重，一次约 40 s）。
# 这是全链路唯一被真正执行过的接缝，见 src/alofa/cli.mojo 的文件头。
generate = "pixi run mojo run -O0 -I src src/alofa/cli.mojo"
# 垂直切片**门**：同上但带断言 —— greedy 必须说出 Paris，且低温采样必须收敛到贪心
# （后者是负向对照：若 sampler 没真正介入，两条路会"碰巧"一致而门形同虚设）。
# 不并入 test：需要那 1.9 GB 权重，与 test-model 同级。
test-slice = "mkdir -p target && pixi run mojo build -O2 -I src tests/unit/test_vertical_slice.mojo -o target/vertical_slice && ./target/vertical_slice"
# 能力账本 CI 门：标了 verified / verified-remote / verified-env 的条目必须给出真实凭证，
# 否则 CI 失败。门本身也含自检（tests/fixtures/ledger_bad.md 必须被拒绝）。
# 详见 docs/plan/capability-ledger.md
check-ledger = "pixi run mojo run tests/capability/test_ledger.mojo"
# N/M 快照门：账本里每个 `?count=N` 必须与本次实测条数一致（target/test_counts.tsv）。
# 必须排在 `pixi run test` **之后** —— 那份清单由 test 顺带产出；清单缺失时这道门会
# 失败，而不是静默跳过（跳过等于它只是个装饰）。
check-counts = "pixi run mojo run tests/capability/test_ledger_counts.mojo"
# 把账本里的 N/M 快照刷新成本次实测值。改完记得 `git diff` 看看漂了什么 —— 那正是
# 这道门要暴露的东西。先用 --dry-run 看结果：pixi run ledger-sync -- --dry-run
ledger-sync = "pixi run python scripts/ledger_sync.py"
build = "rattler-build build -r src -c https://conda.modular.com/max/ -c https://prefix.dev/mojo-force -c https://repo.prefix.dev/modular-community   -c conda-forge --skip-existing=all"
publish = { cmd = "bash scripts/publish.sh", env = { PREFIX_API_KEY = "$PREFIX_API_KEY" } }

[dependencies]
mojo = ">=1.0.0"
python = ">=3.10,<=3.14"

# --- alofa 的外部纯 Mojo 依赖（见 docs/plan/02-architecture.md §2.3）---
# flare: 纯 Mojo 网络栈（reactor/scheduler/timer_wheel/reuseport/io_uring + HTTP1-3/QUIC/TLS）
#        → L5/L6 服务层地基，避免自研事件循环（A7：不重复造轮子）。锁 0.2.x（0.x API 未冻结）
flare = ">=0.2.0,<0.3.0"
# json: 纯 Mojo SIMD 两遍解析 + 编译期反射序列化 → config.json / OpenAI API
json = ">=0.1.2,<0.2.0"
