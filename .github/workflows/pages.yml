name: Pages

# GitHub Pages 发布：把 docs/ 下的 Markdown（含 4000+ 行能力账本）
# 用 pandoc 转成带样式的静态 HTML 上传部署。md 内部链接统一改写为
# .html（Pages 上没有原始 .md 路由）。
on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pandoc（ubuntu-latest 不再预装）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pandoc

      - name: 构建静态站点（pandoc，gfm 方言）
        run: |
          mkdir -p site
          cp -r docs/. site/
          find site -name '*.md' | while read -r f; do
            title=$(basename "${f%.md}")
            pandoc "$f" -f gfm -s \
              --metadata title="alofa — ${title}" \
              --css style.css \
              -o "${f%.md}.html" && rm "$f"
          done
          # md 链接改写为 html（相对路径内部链接；锚点与外链不动）。
          find site -name '*.html' -exec sed -i \
            's/](\([^)h#][^)]*\)\.md)/](\1.html)/g' {} +
          cat > site/style.css <<'CSS'
          :root { color-scheme: light dark; }
          body {
            max-width: 56rem; margin: 0 auto; padding: 2rem 1.25rem 6rem;
            font: 16px/1.7 -apple-system, "Segoe UI", "Noto Sans SC", sans-serif;
          }
          h1, h2, h3 { line-height: 1.3; margin-top: 2.2em; }
          table { border-collapse: collapse; margin: 1.2em 0; display: block; overflow-x: auto; }
          th, td { border: 1px solid #8884; padding: 0.35em 0.7em; text-align: left; }
          th { background: #8881; }
          code { background: #8882; padding: 0.1em 0.35em; border-radius: 4px; font-size: 0.92em; }
          pre code { display: block; padding: 0.9em; overflow-x: auto; }
          blockquote { border-left: 3px solid #8886; margin: 0; padding: 0.1em 1em; color: #888; }
          a { color: #0a7; }
          @media (prefers-color-scheme: dark) { a { color: #5cf; } }
          CSS

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
