name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# 能力账本门（capability-ledger）单独成一个 job，且**排在测试之前**：
# 账本是本项目唯一的事实来源，它的可信度优先于代码是否跑通。
jobs:
  capability-ledger:
    name: 能力账本门
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true

      # 校验器会检查三件事：
      #   1. 真账本里每个 verified 类条目都有真实存在的 evidence / probe
      #   2. tests/fixtures/ledger_bad.md（故意写坏）必须被拒绝 —— 证明门不是空壳
      #   3. 拼错标签（如 `verifed`）不能静默绕过
      - name: 校验能力账本
        run: pixi run check-ledger

  tests:
    name: 测试套件
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true

      - name: 运行测试
        run: pixi run test

      # N/M 快照门：账本里写的 `?count=N` 必须与本次实测条数一致。
      # 必须跟在 **同一个 job 的 test 之后** —— 清单 target/test_counts.tsv 是 test
      # 跑的过程中顺带产出的。别把它放进 capability-ledger job：那里没跑 test，清单
      # 必然缺失，而这道门按设计在缺清单时是失败的（静默跳过会让门退化成装饰）。
      - name: 校验账本里的 N/M 快照
        run: pixi run check-counts
