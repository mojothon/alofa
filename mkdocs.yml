site_name: alofa
site_author: llango
site_description: An inference engine in pure Mojo — verified by gates, measured by adjacent pairs.
site_url: https://mojothon.github.io/alofa/
repo_url: https://github.com/mojothon/alofa
repo_name: mojothon/alofa
edit_uri: edit/main/docs/
copyright: Copyright &copy; <a target="_blank" href="https://github.com/mojothon">mojothon</a>

theme:
  name: material
  logo: images/logo.png
  favicon: favicon.ico
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tracking
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mojothon
      name: mojothon

markdown_extensions:
  - admonition
  - toc:
      toc_depth: 3
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      default_lang: text

nav:
  - Home: index.md
  - Install: install.md
  - Usage: usage.md
  - Principles: principles.md
  - Architecture: architecture.md
  - Developing: developing.md
  - Ledger: plan/capability-ledger.md
  - Version: version.md
