site_name: alofa
site_author: llango
site_description: an inference engine in pure Mojo. 
site_favicon: favicon.ico

repo_url: https://github.com/mojothon/alofa
edit_uri: edit/master/docs/docs
copyright: Copyright &copy; <a target=_blanks href="https://www.github.com/mojothon">llango</a>

theme:
  name: shadocs
  logo: '/images/logo.png'
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tabs
  language: cn
  highlightjs: true
  hljs_languages:
    - python 
    - javascript
    - shell
    - django
  

# Footer
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mojothon
      name: mojothon 

markdown_extensions:
  - admonition
  - toc:
      toc_depth: 2
      permalink: True

# Page tree
nav:
  - index: index.md
  - version: version.md
  - 规划:
      - 生态与竞品分析: plan/01-ecosystem-analysis.md
      - 架构设计: plan/02-architecture.md
      - 路线图与验收门: plan/03-roadmap.md
      - 能力账本: plan/capability-ledger.md